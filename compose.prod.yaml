# Single-host production stack. Runbook: docs/deployment.md.
# Only Caddy publishes ports; PostgreSQL, Redis, MinIO, and the API stay on the
# internal Compose network.
name: teamos-production

x-database-url: &database-url postgresql://${POSTGRES_USER:-teamos}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-teamos}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-teamos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_USER: ${POSTGRES_USER:-teamos}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-teamos} -d ${POSTGRES_DB:-teamos}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}",
      ]
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$${REDIS_PASSWORD}" --no-auth-warning ping | grep PONG']
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    volumes:
      - redis_data:/data

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-teamos}
    healthcheck:
      test: ["CMD-SHELL", "mc ready local"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - minio_data:/data

  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    # Secrets and tuning come from apps/api/.env. The values below override the
    # matching entries there because they describe this stack, not the app.
    env_file:
      - path: apps/api/.env
        required: true
    environment:
      BETTER_AUTH_URL: https://${APP_DOMAIN:?Set APP_DOMAIN in .env}
      CORS_ORIGINS: https://${APP_DOMAIN}
      DATABASE_URL: *database-url
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-teamos}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      NODE_ENV: production
      PORT: "4001"
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      TRUST_PROXY: "true"
      WEB_URL: https://${APP_DOMAIN}
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy

  caddy:
    build:
      context: .
      target: web
      args:
        VITE_API_URL: https://${APP_DOMAIN:?Set APP_DOMAIN in .env}
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_config:/config
      - caddy_data:/data
    depends_on:
      api:
        condition: service_healthy

volumes:
  caddy_config:
  caddy_data:
  minio_data:
  postgres_data:
  redis_data:
